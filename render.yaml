services:
  - type: web
    name: halol-crypto-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --webhook
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBAPP_PORT
        value: "10000"   # Render uses port 10000 by default
      - key: LOG_LEVEL
        value: "INFO"
