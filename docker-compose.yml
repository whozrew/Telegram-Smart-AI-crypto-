version: "3.9"

services:
  halol:
    build: .
    container_name: halol-crypto-ai
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - WEBAPP_HOST=0.0.0.0
      - WEBAPP_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Optional: PostgreSQL for production
  # db:
  #   image: postgres:16-alpine
  #   container_name: halol-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: halol
  #     POSTGRES_USER: halol
  #     POSTGRES_PASSWORD: your_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  postgres_data:
